<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 40px;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h2 { font-weight: 600; letter-spacing: 1px; }
        .back-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.4); }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📚 Registered Students</h2>
            <a href="/" class="back-btn">← Back to Form</a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Email Address</th>
                    <th>Student ID</th>
                    <th>Major/Course</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <tr><td colspan="4" style="text-align: center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchStudents() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                const tbody = document.getElementById('studentTableBody');
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No students registered yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                const courseMap = {
                    'cs': 'Computer Science',
                    'ai': 'Artificial Intelligence',
                    'ds': 'Data Science',
                    'cyber': 'Cybersecurity'
                };

                students.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${s.fullName}</strong></td>
                        <td>${s.email}</td>
                        <td><span class="badge">${s.studentId}</span></td>
                        <td>${courseMap[s.course] || s.course}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ffcccc;">Failed to load data.</td></tr>';
            }
        }
        
        // Load data on page load
        fetchStudents();
    </script>
</body>
</html>
